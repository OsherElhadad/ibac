---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ce-observer
  namespace: ibac
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ce-observer
  template:
    metadata:
      labels:
        app: ce-observer
    spec:
      containers:
        - name: ce-observer
          image: localhost/ibac-ce-observer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7070
          readinessProbe:
            httpGet:
              path: /api/health
              port: 7070
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 7070
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ce-observer
  namespace: ibac
spec:
  type: NodePort
  selector:
    app: ce-observer
  ports:
    - port: 7070
      targetPort: 7070
      nodePort: 30071
      name: http
