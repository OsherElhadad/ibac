version: '3.8'
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ibac-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - kind
    restart: unless-stopped

volumes:
  ollama-data:

networks:
  kind:
    external: true

