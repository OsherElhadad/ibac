apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-backend
  namespace: ibac
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finance-backend
  template:
    metadata:
      labels:
        app: finance-backend
    spec:
      containers:
      - name: finance-backend
        image: localhost/ibac-finance-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8181
        env:
        - name: AUDIT_URL
          value: "http://audit-acme-payments.ibac.svc.cluster.local:9999/log"
        - name: OBSERVER_URL
          value: "http://demo-observer.ibac.svc.cluster.local:7070"
---
apiVersion: v1
kind: Service
metadata:
  name: finance-backend
  namespace: ibac
spec:
  selector:
    app: finance-backend
  ports:
  - port: 8181
    targetPort: 8181
    name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-agent
  namespace: ibac
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finance-agent
  template:
    metadata:
      labels:
        app: finance-agent
    spec:
      hostAliases:
      - ip: "172.20.0.3"
        hostnames:
        - "ibac-ollama"
      initContainers:
      - name: iptables-init
        image: localhost/ibac-iptables-init:latest
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
        - |
          iptables -t nat -N IBAC_REDIRECT
          iptables -t nat -A IBAC_REDIRECT -m owner --uid-owner 101 -j RETURN
          iptables -t nat -A IBAC_REDIRECT -m owner --uid-owner 1001 -j RETURN
          iptables -t nat -A IBAC_REDIRECT -d 127.0.0.1/32 -j RETURN
          iptables -t nat -A IBAC_REDIRECT -p tcp -j REDIRECT --to-port 10001
          iptables -t nat -A OUTPUT -p tcp -j IBAC_REDIRECT
          echo "iptables rules installed"
          iptables -t nat -L IBAC_REDIRECT -v -n
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
          runAsUser: 0
      containers:
      - name: finance-agent
        image: localhost/ibac-finance-agent:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: FINANCE_BACKEND_URL
          value: "http://finance-backend.ibac.svc.cluster.local:8181"
        - name: OBSERVER_URL
          value: "http://demo-observer.ibac.svc.cluster.local:7070"
        - name: OLLAMA_URL
          value: "http://ibac-ollama:11434"
      - name: envoy
        image: envoyproxy/envoy:v1.28-latest
        ports:
        - containerPort: 10000
        - containerPort: 10001
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
        command: ["envoy", "-c", "/etc/envoy/envoy.yaml"]
        securityContext:
          runAsUser: 101
      - name: sidecar
        image: localhost/ibac-sidecar:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9090
        env:
        - name: OLLAMA_URL
          value: "http://ibac-ollama:11434"
        - name: OBSERVER_URL
          value: "http://demo-observer.ibac.svc.cluster.local:7070"
        - name: SPARC_REFLECTOR_URL
          value: "http://sparc-reflector.ibac.svc.cluster.local:8090"
        - name: TRUSTED_DESTINATIONS
          value: "ibac-ollama:11434,host.docker.internal:11434,finance-backend.ibac.svc.cluster.local:8181,demo-observer.ibac.svc.cluster.local:7070"
        securityContext:
          runAsUser: 1001
      volumes:
      - name: envoy-config
        configMap:
          name: envoy-config
---
apiVersion: v1
kind: Service
metadata:
  name: finance-agent
  namespace: ibac
spec:
  type: NodePort
  selector:
    app: finance-agent
  ports:
  - port: 10000
    targetPort: 10000
    nodePort: 30020
    name: envoy-inbound
---
apiVersion: v1
kind: Service
metadata:
  name: audit-acme-payments
  namespace: ibac
spec:
  selector:
    app: evil-server
  ports:
  - port: 9999
    targetPort: 9999
    name: http
