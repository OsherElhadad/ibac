apiVersion: v1
kind: Namespace
metadata:
  name: ibac
---
# IBAC-protected agent: agent + envoy + sidecar in one pod
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ibac-agent
  namespace: ibac
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ibac-agent
  template:
    metadata:
      labels:
        app: ibac-agent
    spec:
      initContainers:
      - name: iptables-init
        image: alpine:3.19
        command: ["/bin/sh", "-c"]
        args:
        - |
          apk add --no-cache iptables
          # Create IBAC_REDIRECT chain
          iptables -t nat -N IBAC_REDIRECT
          # Don't redirect Envoy's own outbound (uid 101) — prevents infinite loop
          iptables -t nat -A IBAC_REDIRECT -m owner --uid-owner 101 -j RETURN
          # Don't redirect sidecar's outbound (uid 1001) — it calls ollama directly
          iptables -t nat -A IBAC_REDIRECT -m owner --uid-owner 1001 -j RETURN
          # Don't redirect localhost traffic (pod-internal: agent↔envoy↔sidecar)
          iptables -t nat -A IBAC_REDIRECT -d 127.0.0.1/32 -j RETURN
          # Redirect everything else to Envoy outbound listener
          iptables -t nat -A IBAC_REDIRECT -p tcp -j REDIRECT --to-port 10001
          # Apply to OUTPUT chain
          iptables -t nat -A OUTPUT -p tcp -j IBAC_REDIRECT
          echo "iptables rules installed"
          iptables -t nat -L IBAC_REDIRECT -v -n
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
          runAsUser: 0
      containers:
      - name: agent
        image: localhost/ibac-agent:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: EMAIL_URL
          value: "http://email-server.ibac.svc.cluster.local:8888"
        - name: OLLAMA_URL
          value: "http://host.docker.internal:11434"
      - name: envoy
        image: envoyproxy/envoy:v1.28-latest
        ports:
        - containerPort: 10000
        - containerPort: 10001
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
        command: ["envoy", "-c", "/etc/envoy/envoy.yaml"]
        securityContext:
          runAsUser: 101
      - name: sidecar
        image: localhost/ibac-sidecar:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9090
        env:
        - name: OLLAMA_URL
          value: "http://host.docker.internal:11434"
        - name: TRUSTED_DESTINATIONS
          value: "host.docker.internal:11434,email-server.ibac.svc.cluster.local:8888"
        securityContext:
          runAsUser: 1001
      volumes:
      - name: envoy-config
        configMap:
          name: envoy-config
---
# Agent without IBAC protection (for comparison demo)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-no-ibac
  namespace: ibac
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-no-ibac
  template:
    metadata:
      labels:
        app: agent-no-ibac
    spec:
      containers:
      - name: agent
        image: localhost/ibac-agent:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: EMAIL_URL
          value: "http://email-server.ibac.svc.cluster.local:8888"
        - name: OLLAMA_URL
          value: "http://host.docker.internal:11434"
---
# NodePort service for IBAC agent (via envoy inbound)
apiVersion: v1
kind: Service
metadata:
  name: ibac-agent
  namespace: ibac
spec:
  type: NodePort
  selector:
    app: ibac-agent
  ports:
  - port: 10000
    targetPort: 10000
    nodePort: 30000
    name: envoy-inbound
---
# NodePort service for agent without IBAC
apiVersion: v1
kind: Service
metadata:
  name: agent-no-ibac
  namespace: ibac
spec:
  type: NodePort
  selector:
    app: agent-no-ibac
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    name: http
