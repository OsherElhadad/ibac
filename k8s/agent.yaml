apiVersion: v1
kind: Namespace
metadata:
  name: ibac
---
# IBAC-protected agent: agent + envoy + sidecar in one pod
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ibac-agent
  namespace: ibac
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ibac-agent
  template:
    metadata:
      labels:
        app: ibac-agent
    spec:
      containers:
      - name: agent
        image: localhost/ibac-agent:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: IBAC_PROXY
          value: "http://localhost:10001"
        - name: EMAIL_URL
          value: "http://email-server.ibac.svc.cluster.local:8888"
        - name: OLLAMA_URL
          value: "http://host.docker.internal:11434"
      - name: envoy
        image: envoyproxy/envoy:v1.28-latest
        ports:
        - containerPort: 10000
        - containerPort: 10001
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
        command: ["envoy", "-c", "/etc/envoy/envoy.yaml"]
      - name: sidecar
        image: localhost/ibac-sidecar:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 9090
        env:
        - name: OLLAMA_URL
          value: "http://host.docker.internal:11434"
      volumes:
      - name: envoy-config
        configMap:
          name: envoy-config
---
# Agent without IBAC protection (for comparison demo)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-no-ibac
  namespace: ibac
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-no-ibac
  template:
    metadata:
      labels:
        app: agent-no-ibac
    spec:
      containers:
      - name: agent
        image: localhost/ibac-agent:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: EMAIL_URL
          value: "http://email-server.ibac.svc.cluster.local:8888"
        - name: OLLAMA_URL
          value: "http://host.docker.internal:11434"
---
# NodePort service for IBAC agent (via envoy inbound)
apiVersion: v1
kind: Service
metadata:
  name: ibac-agent
  namespace: ibac
spec:
  type: NodePort
  selector:
    app: ibac-agent
  ports:
  - port: 10000
    targetPort: 10000
    nodePort: 30000
    name: envoy-inbound
---
# NodePort service for agent without IBAC
apiVersion: v1
kind: Service
metadata:
  name: agent-no-ibac
  namespace: ibac
spec:
  type: NodePort
  selector:
    app: agent-no-ibac
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    name: http
